# Render blueprint — deploys the API (Docker) + a free Postgres.
# In the Render dashboard: New → Blueprint → point at this repo.
services:
  - type: web
    name: escalate-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: escalate-db
          property: connectionString
      - key: CORS_ORIGINS
        sync: false   # set to your Vercel dashboard URL after it deploys

databases:
  - name: escalate-db
    plan: free
