# Render blueprint — deploys the API (Docker) as a self-contained public demo.
# In the Render dashboard: New → Blueprint → point at this repo.
#
# The demo needs no database service and no credentials: it runs on an
# ephemeral SQLite file inside the container, reseeded with synthetic tickets
# on every boot, and rejects all writes. Real deployments point DATABASE_URL
# at Postgres instead (CI-tested; see README "Deployment").
services:
  - type: web
    name: escalate-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        value: sqlite:////tmp/escalate-demo.db   # ephemeral: wiped on every deploy/restart
      - key: CORS_ORIGINS
        value: https://escalate-alpha.vercel.app   # the public dashboard
      - key: ESCALATE_TRUST_PROXY
        value: "true"   # Render is a reverse proxy: rate-limit by X-Forwarded-For
      - key: ESCALATE_READ_ONLY
        value: "true"   # public demo: reject all writes; fixed so a Blueprint sync can't reopen it
      - key: ESCALATE_SEED_DEMO
        value: "true"   # reseed the synthetic demo tickets on every boot
