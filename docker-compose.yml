services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: escalate
      POSTGRES_PASSWORD: escalate
      POSTGRES_DB: escalate
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U escalate"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg2://escalate:escalate@db:5432/escalate
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
